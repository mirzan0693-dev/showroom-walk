plugins { id "com.android.application" }

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def ksFile = file("release.jks")

android {
    namespace "com.mirzan.showroomwalk"
    compileSdk 34
    defaultConfig {
        applicationId "com.mirzan.showroomwalk"
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1." + runNo
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KS_PASS")
                keyAlias "showroomwalk"
                keyPassword System.getenv("KS_PASS")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
