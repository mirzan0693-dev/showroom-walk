<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showroom Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column field clipboard. Sticky header (visit picker, tape-measure progress, section tabs,
   unit-type strip), item rows that open into a fill-in panel, bottom bar for outputs, sheets for tools. */
:root{
  --bg:#E9EBE6;--paper:#F7F8F4;--ink:#1A1E1B;--muted:#5D655F;--line:#C9CEC6;
  --tape:#F0BE2A;--tape-ink:#1A1E1B;--tape-soft:#F7E3A6;--flag:#C8372D;--ok:#2F7A4B;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:15px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141715;--paper:#1D211E;--ink:#E4E7E0;--muted:#98A199;--line:#323833;
  --tape:#E8B921;--tape-ink:#141715;--tape-soft:#4A3F17;--flag:#EE6A5E;--ok:#5FBF85;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715;--paper:#1D211E;--ink:#E4E7E0;--muted:#98A199;--line:#323833;
  --tape:#E8B921;--tape-ink:#141715;--tape-soft:#4A3F17;--flag:#EE6A5E;--ok:#5FBF85;color-scheme:dark}
:root.big{--fs:17.5px}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;padding-block:12px 8px}
.brand{font-family:var(--display);font-stretch:70%;font-weight:800;font-size:22px;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-stretch:100%;font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.visit{flex:1;min-width:0;display:flex;gap:6px;justify-content:flex-end}
.visit select{min-width:0;flex:0 1 auto;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 8px;font-weight:600;font-size:14px}
.ibtn{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:7px 10px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-grid;place-items:center}
.ibtn:hover{border-color:var(--ink)}
.ibtn svg{width:18px;height:18px}

.tape{position:relative;height:26px;margin-block:2px 8px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tape .fill{position:absolute;inset:0 auto 0 0;background:var(--tape);transition:width .3s}
.tape .ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%),repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 2%);background-size:100% 9px,100% 5px;background-repeat:no-repeat;opacity:.55}
.tape .read{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.tape .read b{font-weight:600}

nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:8px 10px 9px;border-bottom:3px solid transparent;font-family:var(--display);font-stretch:80%;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.tab .ct{font:500 11px var(--mono);text-transform:none;letter-spacing:0}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}

.types{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-block:8px;border-top:1px dashed var(--line)}
.types::-webkit-scrollbar{display:none}
.types .lbl{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}
.tchip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:3px;padding:4px 10px;font-size:13px;font-weight:600}
.tchip[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.tchip.add{border-style:dashed;font-weight:500;color:var(--muted)}

main{padding-block:18px 120px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--tape);background:var(--tape-soft);border-radius:4px;padding:8px 10px;margin-bottom:14px;font-size:13.5px}
.sechead{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;margin-bottom:14px}
.secno{font:500 12px var(--mono);color:var(--muted);grid-row:span 2;border:1px solid var(--line);padding:2px 6px;border-radius:3px}
.sechead h2{margin:0;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.sechead p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chipf{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item.open{background:var(--paper)}
.irow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:12px 4px}
.box{width:26px;height:26px;border:2px solid var(--ink);border-radius:3px;background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.box svg{width:16px;height:16px;opacity:0}
.item.done .box{background:var(--ink)}
.item.done .box svg{opacity:1;stroke:var(--paper)}
.ititle{border:0;background:none;padding:0;text-align:left;min-width:0}
.ititle strong{display:block;font-weight:600;font-size:1em;line-height:1.35}
.item.done .ititle strong{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.ititle span{display:block;color:var(--muted);font-size:.87em;margin-top:2px}
.meta{display:flex;gap:6px;align-items:center;padding-top:3px;flex-wrap:wrap;justify-content:flex-end;max-width:110px}
.mk{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.mk.fl{color:var(--flag);font-weight:600}
.mk.ty{border:1px solid var(--line);padding:0 4px;border-radius:2px}
.panel{padding:2px 4px 16px 44px;display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--bg);overflow:hidden}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;padding:8px 9px;font-size:1em;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}
.inp input::placeholder{color:var(--muted);opacity:.7}
.inp .u{font:500 12px var(--mono);color:var(--muted);padding:0 9px;text-transform:none;letter-spacing:0;white-space:nowrap}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:8px 9px;font-size:.97em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:3px;padding:5px 9px;font-size:13px}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.warn[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:#fff}
.calc{font:500 13px/1.6 var(--mono);background:var(--bg);border-left:3px solid var(--tape);padding:8px 10px;font-variant-numeric:tabular-nums}
.calc b{font-weight:600}
.calc .big{display:block;font-family:var(--display);font-stretch:80%;font-weight:800;font-size:26px;line-height:1.1;margin-bottom:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.abtn{border:1px solid var(--line);background:transparent;border-radius:4px;padding:6px 10px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.abtn[aria-pressed="true"].flagb{border-color:var(--flag);color:var(--flag);font-weight:600}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:76px;height:76px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:2px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;padding:0}
input[type=file]{display:none}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:8px;padding-block:10px}
.bbtn{flex:1;border:1px solid var(--ink);background:transparent;border-radius:4px;padding:10px 6px;font-family:var(--display);font-stretch:80%;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.03em;white-space:nowrap}
.bbtn.pri{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}

.scrim{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:8px 8px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:22px;text-transform:uppercase}
.sheet h4{margin:8px 0 0;font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.sheet pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;max-height:46vh;overflow:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tin{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px 9px;min-width:0;width:100%}
.vlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.vrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow .pc{font:500 12px var(--mono);color:var(--muted)}
.danger{color:var(--flag);border-color:var(--flag)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:13.5px;z-index:30;white-space:nowrap}
.sample{font:500 11px var(--mono);color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;text-transform:none}

/* settings */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.sw{width:42px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--bg);position:relative;padding:0;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--tape);border-color:var(--tape)}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:var(--tape-ink)}
.ck{border:1px solid var(--line);border-radius:4px}
.ck .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);font-weight:600;font-size:14px}
.ck .sh .mv{display:flex;gap:4px}
.ck .sh .mv button{width:30px;height:28px;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:0}
.ck .ir{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-top:1px solid var(--line);font-size:13.5px}
.ck .ir span{min-width:0}
.ck .ir.off span{color:var(--muted);text-decoration:line-through}
.cklist{display:flex;flex-direction:column;gap:8px}

/* compare */
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table.cmp{border-collapse:collapse;width:100%;min-width:420px;font-size:13.5px}
.cmp th,.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{background:var(--bg);font-family:var(--display);font-stretch:80%;font-weight:700;font-size:14px;line-height:1.2}
.cmp thead th small{display:block;font:500 11px var(--mono);color:var(--muted)}
.cmp tbody th{font-weight:500;color:var(--muted);font-size:12.5px;white-space:nowrap}
.cmp td{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.cmp td.best{background:var(--tape-soft);font-weight:600}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}

/* sample reels */
.reelcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.rcard{position:relative;text-align:left;border:1px solid var(--ink);background:var(--paper);border-radius:4px;padding:16px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rcard::before,.rcard::after{content:"";position:absolute;left:6px;right:6px;height:5px;background-image:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);opacity:.75}
.rcard::before{top:4px}.rcard::after{bottom:4px}
.rcard .k{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rcard strong{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.05}
.rcard .p{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rcard .p b{color:var(--ink)}
.reelgrid{display:grid;gap:16px;align-items:start}
@media (min-width:640px){.reelgrid{grid-template-columns:auto minmax(0,1fr)}}
.reel{position:relative;aspect-ratio:9/16;height:min(56vh,500px);max-width:100%;margin:0 auto;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.reel canvas{width:100%;height:100%;display:block}
.segs{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:3px}
.segs i{display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.segs i b{display:block;height:100%;width:0;background:var(--ink)}
.rno{position:absolute;top:18px;left:10px;font:600 11px var(--mono);color:var(--ink);background:var(--paper);padding:1px 5px;border-radius:2px}
.rmove{position:absolute;top:18px;right:10px;font:600 11px var(--mono);color:var(--tape-ink);background:var(--tape);padding:1px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:.05em}
.rph{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:17px;color:var(--tape);letter-spacing:.04em;text-shadow:0 1px 0 var(--ink),0 0 6px var(--paper)}
.rcap{position:absolute;left:8px;right:8px;bottom:8px;background:var(--ink);color:var(--paper);border-radius:3px;padding:6px 9px}
.rcap b{display:block;font-weight:600;font-size:13.5px;line-height:1.25}
.rcap span{font:500 11px var(--mono);opacity:.8}
.rctl{display:flex;gap:8px;justify-content:center;margin-top:10px}
.rctl button{width:46px;height:40px;border:1px solid var(--line);background:var(--paper);border-radius:4px;display:grid;place-items:center;padding:0}
.rctl button.pp{width:64px;background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.rctl svg{width:18px;height:18px}
.shots{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);display:flex;flex-direction:column}
.shots li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:9px 4px 9px 6px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.shots li.on{border-left-color:var(--tape);background:var(--bg)}
.shots .box{width:24px;height:24px}
.shots li.done .box{background:var(--ink)}.shots li.done .box svg{opacity:1;stroke:var(--paper)}
.shots .sj{border:0;background:none;padding:0;text-align:left;min-width:0}
.shots .sj strong{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.shots .sj strong em{font:500 11.5px var(--mono);font-style:normal;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.shots .sj span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.rfmt{font:500 12px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:8px 10px}
@media (max-width:440px){.panel{padding-left:4px}.brand small{display:none}.brand{font-size:19px}.bbtn{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">Showroom Walk<small>GALLERY INSPECTION LOG</small></div>
      <div class="visit">
        <select id="visitSel" aria-label="Current visit"></select>
        <button class="ibtn" id="visitsBtn">Visits</button>
        <button class="ibtn" id="setBtn" aria-label="Settings"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5h9M15 5h2M3 10h3M9 10h8M3 15h7M13 15h4"/><circle cx="13.5" cy="5" r="1.6"/><circle cx="7.5" cy="10" r="1.6"/><circle cx="11.5" cy="15" r="1.6"/></svg></button>
      </div>
    </div>
    <div class="tape" aria-hidden="true"><div class="fill" id="tapeFill"></div><div class="ticks"></div><div class="read" id="tapeRead"></div></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="types" id="types"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="bar"><div class="wrap">
  <button class="bbtn" id="flagsBtn">Red flags</button>
  <button class="bbtn" id="cmpBtn">Compare</button>
  <button class="bbtn pri" id="summaryBtn">Summary</button>
</div></div>

<div id="sheetHost"></div>
<input type="file" id="fileIn" accept="image/*" multiple>

<script>
"use strict";
/* per:true = stored separately for each unit type */
const SECTIONS=[
 {id:"unit",short:"Show unit",title:"Show unit vs bare unit",intro:"Separate the interior-design styling from what the buyer actually gets at handover.",items:[
  {id:"partitions",per:1,t:"Non-structural partitions & removed walls",h:"Bedroom walls knocked out? Study turned into open lounge?",f:[{k:"note",type:"text",l:"What was altered"}]},
  {id:"glass",per:1,t:"Glass dividers & oversized mirrors",h:"Spot anything that makes the space read bigger than it is.",f:[]},
  {id:"ceiling",per:1,t:"Floor-to-ceiling heights",h:"Ask for bare-unit height, not the plastered show-unit figure.",f:[{k:"show",type:"num",l:"Show unit",dim:"len"},{k:"bare",type:"num",l:"Bare unit",dim:"len"}],calc:"ceiling"},
  {id:"beams",per:1,t:"Down-hung beams & AC trunking",h:"Where do beams drop? Is ducting hidden in a bulkhead that won't be built?",f:[{k:"note",type:"text",l:"Locations"}]},

function uid(){return Math.random().toString(36).slice(2,9)}
function newType(name){return {id:uid(),name,items:{}}}
function blankVisit(name){const t=newType("Type A");return {id:uid(),name:name||"New visit",date:new Date().toISOString().slice(0,10),items:{},types:[t],curType:t.id}}

const PER_IDS=new Set(SECTIONS.flatMap(s=>s.items).filter(i=>i.per).map(i=>i.id));
function migrate(v){
  if(!v.types){const t=newType("Type A");Object.keys(v.items||{}).forEach(id=>{if(PER_IDS.has(id)){t.items[id]=v.items[id];delete v.items[id]}});v.types=[t];v.curType=t.id}
  if(!v.types.find(t=>t.id===v.curType))v.curType=v.types[0].id;
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.visits&&d.visits.length){S=Object.assign(S,d)}}}catch(e){}
  normalize();
}
function normalize(){
  S.cfg=Object.assign({},DEFAULT_CFG,S.cfg||{});
  ["unit","model","deal","kit"].forEach(id=>{if(!S.cfg.order.includes(id))S.cfg.order.push(id)});
  if(!S.visits.length){S.visits=samples();S.cur=S.visits[0].id}
  S.visits.forEach(migrate);
  if(!S.visits.find(v=>v.id===S.cur))S.cur=S.visits[0].id;
}
let saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveWarned){toast("Storage full. Remove some photos or old visits.");saveWarned=true}}}

const visit=()=>S.visits.find(v=>v.id===S.cur)||S.visits[0];
const typeOf=v=>v.types.find(t=>t.id===v.curType)||v.types[0];
function allDefs(){return SECTIONS.flatMap(s=>s.items).concat(C().custom.map(c=>({id:c.id,t:c.t,h:c.h||"",f:[],chips:c.chips&&c.chips.length?c.chips:null,per:c.per,sec:c.sec,custom:1})))}
const defOf=id=>allDefs().find(d=>d.id===id)||{};
function storeFor(v,t,id){return defOf(id).per?t.items:v.items}
function peekIn(v,t,id){return storeFor(v,t,id)[id]||{}}
const peek=id=>{const v=visit();return peekIn(v,typeOf(v),id)};
function rec(id){const v=visit(),st=storeFor(v,typeOf(v),id);return st[id]||(st[id]={})}
function secById(id){return SECTIONS.find(s=>s.id===id)}
function sectionItems(sec){return sec.items.concat(C().custom.filter(c=>c.sec===sec.id).map(c=>defOf(c.id))).filter(i=>!C().hidden.includes(i.id))}
const orderedSecs=()=>C().order.map(secById).filter(Boolean);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=x=>{const n=parseFloat(String(x==null?"":x).replace(/,/g,""));return isNaN(n)?null:n};
const rm=n=>"RM "+Math.round(n).toLocaleString("en-MY");

/* ---------- units ---------- */
const SQM=10.7639;
function unitLabel(dim){if(dim==="len")return C().len==="ft"?"ft":"mm";if(dim==="area")return C().area==="sqm"?"sq m":"sq ft";if(dim==="rate")return C().area==="sqm"?"RM/psm":"RM/psf";return ""}
function toDisp(dim,raw){const n=num(raw);if(n==null)return raw||"";
  if(dim==="len"&&C().len==="ft")return String(+(n/304.8).toFixed(2));
  if(dim==="area"&&C().area==="sqm")return String(+(n/SQM).toFixed(1));
  if(dim==="rate"&&C().area==="sqm")return String(+(n*SQM).toFixed(3));
  return raw}
function fromDisp(dim,s){const n=num(s);if(n==null)return s;
  if(dim==="len"&&C().len==="ft")return String(+(n*304.8).toFixed(1));
  if(dim==="area"&&C().area==="sqm")return String(+(n*SQM).toFixed(1));
  if(dim==="rate"&&C().area==="sqm")return String(+(n/SQM).toFixed(5));
  return s}
const fmtArea=sqft=>C().area==="sqm"?`${(sqft/SQM).toFixed(1)} sq m`:`${Math.round(sqft).toLocaleString()} sq ft`;
const fmtPer=perSqft=>C().area==="sqm"?`RM ${Math.round(perSqft*SQM).toLocaleString()} psm`:`RM ${Math.round(perSqft).toLocaleString()} psf`;
const fmtLen=mm=>C().len==="ft"?`${(mm/304.8).toFixed(2)} ft`:`${Math.round(mm)} mm`;

/* ---------- numbers for one visit + unit type ---------- */
function metrics(v,t){
  const g=(id,k)=>num(((peekIn(v,t,id).v)||{})[k]);
  const s=(id,k)=>((peekIn(v,t,id).v)||{})[k]||"";
  const m={};
  m.gross=g("price","gross");m.rebate=g("price","rebate")||0;m.size=g("price","size");m.book=g("price","book");
  m.net=m.gross!=null?m.gross-m.rebate:null;
  m.psf=m.net!=null&&m.size?m.net/m.size:null;
  m.rate=g("maint","rate");m.sinkSet=g("maint","sink")!=null;
  m.sink=m.sinkSet?g("maint","sink"):(m.rate!=null?m.rate*C().sinkPct/100:null);
  m.maintPsf=m.rate!=null?m.rate+(m.sink||0):null;
  m.maintMonthly=m.maintPsf!=null&&m.size?m.maintPsf*m.size:null;
  m.margin=g("loan","margin")??C().margin;m.ir=g("loan","rate")??C().rate;m.tenure=g("loan","tenure")??C().tenure;
  if(m.net!=null){m.loanAmt=m.net*m.margin/100;const r=m.ir/1200,n=m.tenure*12;m.monthly=r?m.loanAmt*r/(1-Math.pow(1+r,-n)):m.loanAmt/n;m.income=m.monthly/(C().dsr/100);m.down=m.net-m.loanAmt}
  m.face=s("orient","face");m.stage=s("vp","stage");m.lvl=s("vp","lvl");m.vp=s("vp","vp");
  m.upf=g("lifts","upf");m.pl=g("lifts","pl");m.perLift=m.upf&&m.pl?m.upf/m.pl:null;
  let fl=0,dn=0,tot=0;orderedSecs().forEach(sec=>sectionItems(sec).forEach(it=>{const r=peekIn(v,t,it.id);tot++;if(r.done)dn++;if(r.flag)fl++}));
  m.flags=fl;m.done=dn;m.total=tot;
  return m;
}

function calcText(kind){
  const v=visit(),t=typeOf(v),m=metrics(v,t),g=(id,k)=>num((peek(id).v||{})[k]);
  if(kind==="ceiling"){const s=g("ceiling","show"),b=g("ceiling","bare");if(s&&b)return `Plaster ceiling takes <b>${fmtLen(b-s)}</b> off the bare height.`}
  if(kind==="lifts"&&m.perLift)return `<b>${m.perLift.toFixed(1)}</b> units per passenger lift on each floor${m.perLift>C().liftWarn?" · expect queues at peak hours":""}.`;
  if(kind==="price"&&m.net!=null){let x=`Net nett <b>${rm(m.net)}</b>`;if(m.rebate&&m.gross)x+=` · ${(m.rebate/m.gross*100).toFixed(1)}% off`;if(m.psf)x+=` · <b>${fmtPer(m.psf)}</b>`;return x}
  if(kind==="maint"&&m.maintPsf!=null){const per=C().area==="sqm"?`RM ${(m.maintPsf*SQM).toFixed(2)} psm`:`RM ${m.maintPsf.toFixed(3)} psf`;
    return m.maintMonthly?`<b>${rm(m.maintMonthly)}</b> / month for ${fmtArea(m.size)} (${per} incl. sinking fund${m.sinkSet?"":" at "+C().sinkPct+"%"})`:`${per} incl. sinking fund · add built-up under Pricing for the monthly figure`}
  if(kind==="loan"){if(m.net==null)return "Enter the gross price under Pricing & rebates first.";
    return `<span class="big">${rm(m.monthly)}<small style="font-size:14px;font-weight:600"> /month</small></span>Loan ${rm(m.loanAmt)} (${m.margin}%) · ${m.ir}% · ${m.tenure} yrs<br>Downpayment <b>${rm(m.down)}</b> · income needed ≈ <b>${rm(m.income)}</b> at ${C().dsr}% DSR`}
  return "";
}

const $=s=>document.querySelector(s);
const tick='<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
function secProgress(sec){const its=sectionItems(sec);return [its.filter(i=>peek(i.id).done).length,its.length]}
function applyDisplay(){

function renderHeader(){

  $("#tabs").innerHTML=orderedSecs().map(s=>{const [a,b]=secProgress(s);return `<button class="tab" role="tab" aria-selected="${s.id===S.tab}" data-tab="${s.id}">${esc(s.short)}<span class="ct">${a}/${b}</span></button>`}).join("");
  $("#types").innerHTML=`<span class="lbl">Unit type</span>${v.types.map(t=>`<button class="tchip" data-type="${t.id}" aria-pressed="${t.id===v.curType}">${esc(t.name)}${t.id===v.curType?' <span aria-hidden="true">✎</span>':""}</button>`).join("")}<button class="tchip add" data-type="+">+ Type</button>`;
}
function fieldHTML(it,f){
  const raw=(peek(it.id).v||{})[f.k]||"",val=f.dim?toDisp(f.dim,raw):raw,id=`f_${it.id}_${f.k}`;
  let ph="";if(f.ph==="margin")ph=C().margin;if(f.ph==="rate")ph=C().rate;if(f.ph==="tenure")ph=C().tenure;if(f.ph==="sink")ph="auto "+C().sinkPct+"%";
  let ctl;
  if(f.type==="sel")ctl=`<select id="${id}" data-item="${it.id}" data-k="${f.k}"><option value="">—</option>${f.o.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else{const u=f.dim?unitLabel(f.dim):f.u;ctl=`<input id="${id}" data-item="${it.id}" data-k="${f.k}" ${f.dim?`data-dim="${f.dim}"`:""} value="${esc(val)}" placeholder="${esc(ph)}" ${f.type==="num"?'inputmode="decimal"':""} autocomplete="off">${u?`<span class="u">${u}</span>`:""}`}
  return `<label class="f" for="${id}">${esc(f.l)}<span class="inp">${ctl}</span></label>`;
}
function itemHTML(it){
  const r=peek(it.id),isOpen=openItem===it.id,v=visit();
  const photos=(r.photos||[]).length,hasNote=!!(r.note&&r.note.trim());
  const typeTag=it.per&&v.types.length>1?`<span class="mk ty">${esc(typeOf(v).name)}</span>`:"";
  let h=`<div class="item ${r.done?"done":""} ${isOpen?"open":""}" data-id="${it.id}">
   <div class="irow">
    <button class="box" data-act="done" aria-label="Mark ${esc(it.t)} checked" aria-pressed="${!!r.done}">${tick}</button>
    <button class="ititle" data-act="open" aria-expanded="${isOpen}"><strong>${esc(it.t)}</strong>${it.h?`<span>${esc(it.h)}</span>`:""}</button>
    <div class="meta">${typeTag}${r.flag?'<span class="mk fl">FLAG</span>':""}${photos?`<span class="mk">${photos} img</span>`:""}${hasNote?'<span class="mk">note</span>':""}</div>
   </div>`;
  if(isOpen){
    h+=`<div class="panel">`;
    if(it.f&&it.f.length)h+=`<div class="fields">${it.f.map(f=>fieldHTML(it,f)).join("")}</div>`;
    if(it.chips)h+=`<div class="chips">${it.chips.map(c=>`<button class="chip ${it.warn?"warn":""}" data-act="chip" data-c="${esc(c)}" aria-pressed="${(r.chips||[]).includes(c)}">${esc(c)}</button>`).join("")}</div>`;
    if(it.calc){const c=calcText(it.calc);h+=`<div class="calc" data-calc="${it.calc}" ${c?"":"hidden"}>${c}</div>`}
    h+=`<textarea id="n_${it.id}" data-note="${it.id}" placeholder="Notes for this item">${esc(r.note||"")}</textarea>`;
    if(photos)h+=`<div class="photos">${r.photos.map((p,i)=>`<div class="ph"><img src="${p}" alt="Photo ${i+1}"><button data-act="rmph" data-i="${i}" aria-label="Remove photo">×</button></div>`).join("")}</div>`;
    h+=`<div class="actions"><button class="abtn" data-act="photo">+ Photo</button><button class="abtn flagb" data-act="flag" aria-pressed="${!!r.flag}">${r.flag?"Flagged":"Flag concern"}</button></div></div>`;
  }
  return h+`</div>`;
}
function backupBanner(){
  if(!C().backupRemind)return "";
  const real=S.visits.some(v=>!v.sample);if(!real)return "";
  const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(days!=null&&days<7)return "";
  return `<div class="banner"><span>${days==null?"You haven't backed up your visits yet.":`Last backup ${days} days ago.`}</span><button class="abtn" id="bkNow">Back up now</button></div>`;
}
function renderMain(){
  const secs=orderedSecs(),si=secs.findIndex(s=>s.id===S.tab),sec=secs[si];
  let items=sectionItems(sec);
  if(S.filter==="todo")items=items.filter(i=>!peek(i.id).done);
  if(S.filter==="flag")items=items.filter(i=>peek(i.id).flag);
  const v=visit();
  $("#main").innerHTML=`${backupBanner()}
   <div class="sechead"><span class="secno">${si+1}/${secs.length}</span><h2>${esc(sec.title)}${v.sample&&si===0?'<span class="sample">example data</span>':""}</h2><p>${esc(sec.intro)}</p></div>
   ${sec.id==="kit"?reelCardsHTML():""}
   <div class="tools">${[["all","All"],["todo","Not checked"],["flag","Flagged"]].map(([k,l])=>`<button class="chipf" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div>
   <div class="list">${items.map(itemHTML).join("")||`<p style="color:var(--muted);padding:16px 4px;margin:0">Nothing here for this filter.</p>`}</div>`;
  const b=$("#bkNow");if(b)b.onclick=()=>openVisits(true);
}
function render(){applyDisplay();renderHeader();renderMain()}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("#sheetHost"))return;
  const t=e.target.closest("[data-tab],[data-filter],[data-type],[data-act],[data-reel]");if(!t)return;
  if(t.dataset.reel){openReel(t.dataset.reel);return}
  if(t.dataset.tab){S.tab=t.dataset.tab;openItem=null;save();render();window.scrollTo(0,0);return}
  if(t.dataset.filter){S.filter=t.dataset.filter;save();renderMain();return}
  if(t.dataset.type){const v=visit();
    if(t.dataset.type==="+"){const t2=newType("Type "+String.fromCharCode(65+v.types.length));v.types.push(t2);v.curType=t2.id;save();render();toast(t2.name+" added");return}
    if(t.dataset.type===v.curType){openType();return}
    v.curType=t.dataset.type;save();render();return}

$("#fileIn").addEventListener("change",async e=>{

function shrink(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const m=720,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.62))};im.src=rd.result};rd.readAsDataURL(file)})}

function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("Copied"),()=>fallback())}else fallback();
  function fallback(){const p=document.querySelector(".sheet pre,.sheet textarea");if(p){const rg=document.createRange();rg.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(rg)}toast("Select the text and copy it manually")}

function clientSummary(){
  const v=visit(),t=typeOf(v),m=metrics(v,t),T=TX[C().lang]||TX.mix,E=x=>C().emoji?x+" ":"",val=(id,k)=>((peekIn(v,t,id).v)||{})[k]||"",L=[];
  L.push(`*${v.name}${v.types.length>1||t.name!=="Type A"?" · "+t.name:""}*`);L.push(`${T.visit} · ${v.date}`);L.push("");
  if(m.gross!=null)L.push(`${E("💰")}${T.price}: ${rm(m.gross)}${m.rebate?` → ${T.net} ${rm(m.net)}`:""}${m.size?` (${fmtArea(m.size)}, ${fmtPer(m.psf)})`:""}`);
  if(m.book)L.push(`${T.book}: ${rm(m.book)}`);
  if(m.monthly)L.push(`${E("🏦")}${T.loan}: ${rm(m.monthly)}${T.mo} (${T.loanOf} ${m.margin}%, ${m.ir}%, ${m.tenure} ${T.yrs})`,`${T.down}: ${rm(m.down)} · ${T.inc}: ${rm(m.income)}`);
  const inc=peekIn(v,t,"incent").chips||[];if(inc.length)L.push(`${T.pkg}: ${inc.join(", ")}`);
  if(m.maintPsf!=null)L.push(`${T.maint}: ${C().area==="sqm"?"RM "+(m.maintPsf*SQM).toFixed(2)+" psm":"RM "+m.maintPsf.toFixed(2)+" psf"}${m.maintMonthly?` ≈ ${rm(m.maintMonthly)}${T.mo}`:""}`);
  if(m.stage||m.vp)L.push(`${E("🏗")}${T.prog}: ${[m.stage,m.lvl&&(T.lvl+" "+m.lvl),m.vp&&("VP "+m.vp)].filter(Boolean).join(" · ")}`);
  L.push("");
  if(m.face)L.push(`${E("🧭")}${T.face} ${m.face}`);
  const fl=[val("floor","type"),val("floor","size")].filter(x=>x&&x!=="Not tile").join(" ");if(fl)L.push(`${T.floor}: ${fl}`);
  const kc=peekIn(v,t,"kitchen").chips||[];if(kc.length||val("kitchen","top"))L.push(`${T.kit}: ${[...kc,val("kitchen","top")&&val("kitchen","top")+" "+T.top].filter(Boolean).join(", ")}`);
  const bc=[val("bath","brand"),...(peekIn(v,t,"bath").chips||[])].filter(Boolean);if(bc.length)L.push(`${T.bath}: ${bc.join(", ")}`);
  if(num(val("ceiling","bare")))L.push(`${T.ceil}: ${fmtLen(num(val("ceiling","bare")))}`);
  if(m.upf)L.push(`${m.upf} ${T.upf}, ${m.pl||"?"} ${T.lifts}`);
  const fac=peekIn(v,t,"fac").chips||[];if(fac.length)L.push(`${E("🏊")}${T.fac}: ${fac.join(", ")}`);

function flagsList(){

  const area=C().area==="sqm"?"psm":"psf";

    ["Price per "+(C().area==="sqm"?"sq m":"sq ft"),m=>m.psf,fmtPer,"low"],["Monthly instalment",m=>m.monthly,rm,"low"],

    ["VP",m=>m.vp||null],["Units per lift",m=>m.perLift,x=>x.toFixed(1),"low"],["Red flags",m=>m.flags,String,"low"],["Checked",m=>m.total?m.done/m.total:null,x=>Math.round(x*100)+"%","high"]];

   ${cols.length?`<div class="tblw"><table class="cmp"><thead><tr><th></th>${cols.map(c=>`<th>${esc(c.t.name)}<small>${esc(c.v.name.replace(/^Sample · /,""))}</small></th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`:`<p>Select at least one unit type.</p>`}
   <div class="row"><button class="bbtn" id="cpCmp">Copy as text</button><button class="bbtn" data-close>Close</button></div>`,host=>{

   <button class="bbtn" data-close>Close</button>`,host=>{
    const cv=$("#rc"),ctx=cv.getContext("2d"),dpr=Math.min(2,window.devicePixelRatio||1);

    const setPlay=p=>{playing=p;const b=$("#rPlay");b.innerHTML=p?pause:play;b.setAttribute("aria-label",p?"Pause":"Play")};setPlay(playing);
    const jump=i=>{t=starts[(i+R0.shots.length)%R0.shots.length]+.001;last=performance.now()};
    $("#rPlay").onclick=()=>{setPlay(!playing);last=performance.now()};
    $("#rPrev").onclick=()=>jump(curI-1);$("#rNext").onclick=()=>jump(curI+1);
    host.querySelectorAll("[data-sj]").forEach(b=>b.onclick=()=>{jump(+b.dataset.sj);if(!playing)frame(performance.now(),true)});
    host.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{const i=b.dataset.sd;done[i]=!done[i];b.setAttribute("aria-pressed",!!done[i]);b.closest("li").classList.toggle("done",!!done[i]);save()});

      if(playing){t+=(now-last)/1000;if(t>=total)t=0}last=now;
      let i=0;while(i<starts.length-1&&t>=starts[i+1])i++;
      const s=R0.shots[i],p=ease((t-starts[i])/s.d);
      if(i!==curI){curI=i;$("#rno").textContent=`${String(i+1).padStart(2,"0")}/${R0.shots.length}`;$("#rmv").textContent=MOVES[s.m];$("#rt").textContent=s.t;$("#rs").textContent=`${MOVES[s.m]} · hold ${s.d}s`;
        lis.forEach((li,k)=>li.classList.toggle("on",k===i))}

      if(s.m==="orbit"){ctx.scale(1.1-.08*Math.sin(p*Math.PI),1.1);ctx.rotate((p-.5)*.12)}

      if(s.m==="pan")ctx.translate(70-140*p,0);
      if(s.m==="panl")ctx.translate(-70+140*p,0);
      if(s.m==="tilt")ctx.translate(0,-a[0]+(a[0]+a[1])*p);
      if(s.m==="tiltd")ctx.translate(0,a[1]-(a[0]+a[1])*p);
      if(s.m==="push"||s.m==="pull"||s.m==="hold"||s.m==="orbit")ctx.translate(0,0);
      drawScene(ctx,s.s,col,t);

    }

    if(reduce)frame(performance.now(),true);
  });
}
